<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-labelledby="title desc"><title id="title">Reading post-training metrics</title><desc id="desc">Check definitions, inspect outcomes and learning signals, connect updates and behavior, and test hypotheses under fixed evaluation. A conceptual workflow, not empirical evidence.</desc><rect width="900" height="900" rx="32" fill="#0f172a"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="450" y="80" fill="#f8fafc" font-size="36" font-weight="700">POST-TRAINING TRACKING</text><text x="450" y="122" fill="#94a3b8" font-size="23">Definitions → Evidence → Controlled checks</text><rect x="65" y="164" width="770" height="120" rx="20" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="450" y="212" fill="#38bdf8" font-size="29">1 · Define the measurement</text><text x="450" y="250" fill="#e2e8f0" font-size="22">Algorithm · Mask · Reduction · Sampling · Version</text><path d="M450 292v39m-10-10 10 10 10-10" stroke="#64748b" stroke-width="3" fill="none"/><rect x="65" y="342" width="770" height="130" rx="20" fill="#1e293b"/><text x="450" y="389" fill="#a7f3d0" font-size="29">2 · Inspect outcomes &amp; signal</text><text x="450" y="427" fill="#e2e8f0" font-size="22">Held-out scores · Reward groups · Teacher coverage</text><path d="M450 480v39m-10-10 10 10 10-10" stroke="#64748b" stroke-width="3" fill="none"/><rect x="65" y="530" width="770" height="130" rx="20" fill="#1e293b"/><text x="450" y="577" fill="#fde68a" font-size="29">3 · Connect updates &amp; behavior</text><text x="450" y="615" fill="#e2e8f0" font-size="22">Ratio · KL · Gradients · Entropy · Length · Stops</text><path d="M450 668v39m-10-10 10 10 10-10" stroke="#64748b" stroke-width="3" fill="none"/><rect x="65" y="718" width="770" height="110" rx="20" fill="#1e293b" stroke="#c4b5fd" stroke-width="2"/><text x="450" y="760" fill="#c4b5fd" font-size="29">4 · Test one hypothesis</text><text x="450" y="800" fill="#e2e8f0" font-size="22">Fixed prompts · Fixed budget · Baseline comparison</text><text x="450" y="867" fill="#94a3b8" font-size="20">Conceptual illustration · Not measured data or causal proof</text></g></svg>
