name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
      discussions: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build static site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pip install -r requirements-build.txt
          python scripts/test_taxonomy.py
          python scripts/test_article_graph.py
          python scripts/test_publish.py
          python scripts/test_syndication.py
          WRITE_FEED_STATE=1 python scripts/build_site.py
          python scripts/check_site_indexes.py
          python scripts/generate_media_manifest.py
      - name: Archive processed markdown & commit generated updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/archive_posts.py
          git add -A data/media-cdn.json data/feed-state.json content/posts
          if ! git diff --cached --quiet; then
            git commit -m "Update publishing state and archive new posts [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
